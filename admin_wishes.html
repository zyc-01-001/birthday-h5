<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>愿望管理后台</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--pink:#ff6b9d;--purple:#e040fb;--lavender:#b388ff;--gold:#ffd700;--bg:#0d0a1a;--card:rgba(20,15,40,0.95);}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff;min-height:100vh;padding:20px;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 20% 50%,rgba(224,64,251,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(255,107,157,0.06) 0%,transparent 50%),var(--bg);pointer-events:none;}
.container{max-width:800px;margin:0 auto;position:relative;z-index:1;}
.header{text-align:center;padding:40px 20px 30px;border-bottom:1px solid rgba(255,215,0,0.15);margin-bottom:30px;}
.header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#ffd700,#ff6b9d,#b388ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px;}
.header p{color:rgba(255,255,255,0.5);font-size:13px;margin-top:8px;letter-spacing:1px;}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:30px;}
.stat-card{background:var(--card);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:20px;text-align:center;backdrop-filter:blur(10px);}
.stat-num{font-size:36px;font-weight:900;background:linear-gradient(135deg,#ffd700,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-label{color:rgba(255,255,255,0.5);font-size:12px;margin-top:4px;letter-spacing:1px;}

.add-section{background:var(--card);border:1px solid rgba(255,215,0,0.15);border-radius:12px;padding:24px;margin-bottom:24px;}
.add-section h3{font-size:16px;color:#ffd700;margin-bottom:16px;letter-spacing:1px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;}
.form-group textarea{width:100%;padding:12px 14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,215,0,0.2);border-radius:8px;color:#fff;font-size:16px;outline:none;transition:border-color .3s;font-family:inherit;min-height:60px;resize:vertical;}
.form-group textarea:focus{border-color:rgba(255,215,0,0.5);}
.form-group textarea::placeholder{color:rgba(255,255,255,0.25);}
.add-actions{display:flex;gap:12px;flex-wrap:wrap;}

.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;cursor:pointer;transition:all .3s;font-weight:600;letter-spacing:1px;}
.btn-primary{background:linear-gradient(135deg,#ffd700,#ff6b9d);color:#0d0a1a;}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,215,0,0.4);}
.btn-secondary{background:transparent;border:1px solid rgba(255,107,157,0.4);color:#ff8fb4;}
.btn-secondary:hover{border-color:#ff6b9d;background:rgba(255,107,157,0.1);}
.btn-danger{background:transparent;border:1px solid rgba(255,68,68,0.4);color:#ff6b6b;}
.btn-danger:hover{border-color:#ff4444;background:rgba(255,68,68,0.1);}

.wish-list{display:flex;flex-direction:column;gap:12px;}
.wish-card{background:var(--card);border:1px solid rgba(255,215,0,0.1);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:all .3s;}
.wish-card:hover{border-color:rgba(255,215,0,0.25);transform:translateX(4px);}
.wish-card::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,#ffd700,#ff6b9d);border-radius:3px 0 0 3px;}
.wish-content{font-size:18px;font-weight:600;line-height:1.6;background:linear-gradient(135deg,#ffd700,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;padding-right:80px;}
.wish-meta{display:flex;gap:16px;font-size:12px;color:rgba(255,255,255,0.4);flex-wrap:wrap;}
.wish-meta span{display:flex;align-items:center;gap:4px;}
.wish-id{position:absolute;top:12px;right:16px;font-family:monospace;font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:1px;}
.wish-source{position:absolute;top:28px;right:16px;font-size:10px;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
.wish-source.h5{background:rgba(0,255,136,0.15);color:#00ff88;border:1px solid rgba(0,255,136,0.3);}
.wish-source.manual{background:rgba(255,215,0,0.15);color:#ffd700;border:1px solid rgba(255,215,0,0.3);}

.empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3);}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:0.3;}
.empty-state p{font-size:14px;line-height:1.8;}

.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}

.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:8px;font-size:14px;background:rgba(0,255,136,0.15);border:1px solid rgba(0,255,136,0.3);color:#00ff88;transform:translateX(120%);transition:transform .3s;max-width:340px;}
.toast.show{transform:translateX(0);}
.toast.error{background:rgba(255,68,68,0.15);border-color:rgba(255,68,68,0.3);color:#ff6b6b;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.2);border-radius:3px;}

@media(max-width:600px){
  .stats{grid-template-columns:1fr;}
  .wish-content{font-size:16px;}
  .header h1{font-size:22px;}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>WISH MANAGEMENT</h1>
    <p>愿望收集管理后台 / Birthday H5 Wishes Dashboard</p>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">总愿望数</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="todayCount">0</div>
      <div class="stat-label">今日新增</div>
    </div>
  </div>

  <div class="add-section">
    <h3>手动添加愿望</h3>
    <div class="form-group">
      <label>愿望内容</label>
      <textarea id="manualWishInput" placeholder="输入愿望内容..."></textarea>
    </div>
    <div class="add-actions">
      <button class="btn btn-primary" onclick="addManualWish()">添加愿望</button>
      <button class="btn btn-secondary" onclick="exportWishes()">导出 JSON</button>
      <button class="btn btn-danger" onclick="clearAllWishes()">清空所有</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-secondary" onclick="refreshWishes()">刷新列表</button>
  </div>

  <div class="wish-list" id="wishList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const WISH_API_URL = 'https://jsonblob.com/api/jsonBlob/019fa3f0-1df4-7ffc-bc87-74376f88fe1a';

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => toast.className = 'toast', 3000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 从 JSONBlob API 读取愿望
async function getWishes() {
  try {
    const res = await fetch(WISH_API_URL);
    if (res.ok) {
      const data = await res.json();
      return data.wishes || [];
    }
  } catch (e) {
    console.error('读取云端数据失败:', e);
  }
  return [];
}

// 写入愿望到 JSONBlob API
async function saveWishes(wishes) {
  try {
    await fetch(WISH_API_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ wishes: wishes })
    });
  } catch (e) {
    console.error('写入云端数据失败:', e);
    showToast('云端同步失败', true);
  }
}

async function refreshWishes() {
  const wishes = await getWishes();
  const list = document.getElementById('wishList');

  // 统计
  document.getElementById('totalCount').textContent = wishes.length;
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = wishes.filter(w => w.timestamp && w.timestamp.slice(0, 10) === today).length;
  document.getElementById('todayCount').textContent = todayCount;

  if (wishes.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">&#9733;</div><p>暂无愿望数据<br>在上方输入框添加愿望<br>或等待 H5 页面的许愿同步</p></div>';
    return;
  }

  // 按时间倒序
  wishes.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  list.innerHTML = wishes.map(w => {
    const time = new Date(w.timestamp);
    const timeStr = time.toLocaleString('zh-CN', {
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit'
    });
    const source = w.source || 'manual';
    const sourceClass = source === 'h5' ? 'h5' : 'manual';
    const sourceText = source === 'h5' ? 'H5自动' : '手动添加';
    return '<div class="wish-card">' +
      '<div class="wish-id">' + (w.id || '--').substr(0, 12) + '</div>' +
      '<div class="wish-source ' + sourceClass + '">' + sourceText + '</div>' +
      '<div class="wish-content">"' + escapeHtml(w.wish) + '"</div>' +
      '<div class="wish-meta">' +
        '<span>&#128337; ' + timeStr + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function addManualWish() {
  const input = document.getElementById('manualWishInput');
  const wishText = input.value.trim();
  if (!wishText) {
    showToast('请输入愿望内容', true);
    return;
  }

  const wishData = {
    wish: wishText,
    timestamp: new Date().toISOString(),
    id: Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substr(2, 4).toUpperCase(),
    source: 'manual'
  };

  const wishes = await getWishes();
  wishes.push(wishData);
  await saveWishes(wishes);

  input.value = '';
  showToast('愿望已添加');
  refreshWishes();
}

async function exportWishes() {
  const wishes = await getWishes();
  if (wishes.length === 0) {
    showToast('暂无数据可导出', true);
    return;
  }
  const json = JSON.stringify(wishes, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'birthday_wishes_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

async function clearAllWishes() {
  if (!confirm('确定要清空所有愿望数据吗？此操作不可恢复。')) return;
  await saveWishes([]);
  showToast('数据已清空');
  refreshWishes();
}

// 每30秒自动刷新
setInterval(refreshWishes, 30000);

// 初始化
refreshWishes();
</script>
</body>
</html>
